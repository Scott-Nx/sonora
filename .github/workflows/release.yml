name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_PROFILE_RELEASE_STRIP: symbols
  RUST_BACKTRACE: 1
  RUSTC_WRAPPER: sccache
  SCCACHE_GHA_ENABLED: "true"

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-22.04-arm
          - target: aarch64-apple-darwin
            os: macos-15
          - target: x86_64-apple-darwin
            os: macos-15-intel
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            features: --features bundled-sqlite
    steps:
      - uses: actions/checkout@v5

      - name: name the artifact
        id: meta
        shell: bash
        run: |
          case "$GITHUB_REF" in
            refs/tags/*) version="$GITHUB_REF_NAME" ;;
            *) version="$(git rev-parse --short HEAD)" ;;
          esac
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config mold \
            libasound2-dev libfontconfig1-dev libfreetype-dev libsqlite3-dev \
            libx11-dev libxcb1-dev libxcursor-dev libxi-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libvulkan-dev libdbus-1-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: mozilla-actions/sccache-action@v0.0.9
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
          cache-targets: false
          cache-on-failure: true
      - name: build
        run: cargo build --release --locked --package sonora --target ${{ matrix.target }} ${{ matrix.features }}

      - name: sccache stats
        if: always()
        run: sccache --show-stats
      - name: stage the executable
        shell: bash
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          mkdir -p dist
          case "$RUNNER_OS" in
            macOS)
              cp \
                "target/$TARGET/release/sonora" \
                "dist/sonora-$TARGET"
              ;;

            Windows)
              cp \
                "target/$TARGET/release/sonora.exe" \
                "dist/sonora-$VERSION-$TARGET.exe"
              ;;

            *)
              cp \
                "target/$TARGET/release/sonora" \
                "dist/sonora-$VERSION-$TARGET"
              ;;
          esac

      - name: install Inno Setup
        if: runner.os == 'Windows'
        shell: pwsh
        run: choco install innosetup --yes --no-progress

      - name: build the Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          TARGET: ${{ matrix.target }}
        run: |
          $number = $env:VERSION.TrimStart("v")
          if ($number -notmatch '^\d+\.\d+\.\d+([.-][0-9A-Za-z.-]+)?$') {
            $number = "0.0.0"
          }
          $env:SONORA_VERSION = $number
          $env:SONORA_EXE = (Resolve-Path "target/$env:TARGET/release/sonora.exe").Path
          $env:SONORA_DIST = (Resolve-Path "dist").Path
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "scripts/windows/sonora.iss"

      - uses: actions/upload-artifact@v4
        with:
          name: "${{ runner.os == 'macOS' && format('darwin-{0}', matrix.target) || format('release-{0}', matrix.target) }}"
          path: dist/*
          if-no-files-found: error

  bundle:
    name: macos app bundle
    needs: build
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5

      - name: name the artifact
        id: meta
        shell: bash
        run: |
          case "$GITHUB_REF" in
            refs/tags/*)
              version="$GITHUB_REF_NAME"
              number="${GITHUB_REF_NAME#v}"
              ;;

            *)
              version="$(git rev-parse --short HEAD)"
              number="0.0.0"
              ;;
          esac
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "number=$number" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v4
        with:
          pattern: darwin-*
          path: darwin
          merge-multiple: true

      - name: assemble the bundle
        shell: bash
        env:
          NUMBER: ${{ steps.meta.outputs.number }}
        run: |
          set -euo pipefail

          mkdir -p \
            Sonora.app/Contents/MacOS \
            Sonora.app/Contents/Resources

          lipo -create \
            -output Sonora.app/Contents/MacOS/sonora \
            darwin/sonora-aarch64-apple-darwin \
            darwin/sonora-x86_64-apple-darwin
          chmod +x Sonora.app/Contents/MacOS/sonora
          lipo -info Sonora.app/Contents/MacOS/sonora

          cp \
            assets/macos/sonora.icns \
            Sonora.app/Contents/Resources/

          cp \
            COPYING \
            Sonora.app/Contents/Resources/LICENSE

          cp \
            THIRD-PARTY.md \
            Sonora.app/Contents/Resources/

          mkdir -p Sonora.app/Contents/Resources/icons
          cp assets/icons/LICENSE Sonora.app/Contents/Resources/icons/LICENSE
          for licence in assets/icons/*/LICENSE; do
            pack="$(basename "$(dirname "$licence")")"
            cp "$licence" "Sonora.app/Contents/Resources/icons/LICENSE.$pack"
          done

          sed \
            "s/@VERSION@/$NUMBER/g" \
            assets/macos/Info.plist \
            > Sonora.app/Contents/Info.plist

          plutil -lint Sonora.app/Contents/Info.plist

      - name: sign the bundle
        shell: bash
        run: |
          set -euo pipefail

          codesign \
            --force \
            --sign - \
            Sonora.app

          codesign \
            --verify \
            --strict \
            --verbose=2 \
            Sonora.app

      - name: create the disk image
        shell: bash
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p dist staging
          cp -R Sonora.app staging/
          ln -s /Applications staging/Applications
          megabytes=$(du -ms staging | cut -f1)
          hdiutil create \
            -volname Sonora \
            -srcfolder staging \
            -size "$((megabytes + 128))m" \
            -ov \
            -format UDZO \
            "dist/sonora-$VERSION-macos.dmg"

      - uses: actions/upload-artifact@v4
        with:
          name: release-macos
          path: dist/*
          if-no-files-found: error

  release:
    needs: [build, bundle]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: stage the licenses
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          mkdir -p licenses
          cp COPYING licenses/LICENSE
          cp THIRD-PARTY.md licenses/THIRD-PARTY.md
          mkdir -p licenses/icons
          cp assets/icons/LICENSE licenses/icons/LICENSE
          for licence in assets/icons/*/LICENSE; do
            pack="$(basename "$(dirname "$licence")")"
            cp "$licence" "licenses/icons/LICENSE.$pack"
          done
          tar -czf "dist/sonora-$VERSION-licenses.tar.gz" -C licenses .

      - name: checksums
        run: cd dist && shasum -a 256 * > SHA256SUMS

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          fail_on_unmatched_files: true

  announce:
    needs: release
    if: startsWith(github.ref, 'refs/tags/')
    uses: ./.github/workflows/announce.yml
    secrets: inherit
    with:
      tag: ${{ github.ref_name }}
